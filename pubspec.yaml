name: expense_manager
description: Offline-first personal expense manager with encrypted local storage and Supabase sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database (SQLite + SQLCipher encryption at rest)
  sqflite_common: ^2.5.4
  sqflite_sqlcipher: ">=3.1.0 <4.0.0"
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2

  # Cloud sync + auth
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0
  http: ^1.2.2

  # UI
  fl_chart: ">=0.69.0 <2.0.0"
  intl: ">=0.19.0 <0.21.0"

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.5
  collection: ^1.18.0

  # Device features
  local_auth: ^2.3.0
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  file_picker: ">=8.3.0 <11.0.0"
  share_plus: ">=10.1.0 <12.0.0"
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
